spring.application.name=zeladoria-urbana-api

# Configuracao do Banco de Dados MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/zeladoria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:SuaSenhaAqui}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracao do JPA / Hibernate (Abstracao do Banco, CamelCase e Controle de IDs pelo JPA)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=standard
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Configuracao do Swagger / Springdoc OpenAPI 3 (Estilizado com CSS moderno)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.custom-css-url=/css/swagger-custom.css
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true

# Porta do Servidor
server.port=${PORT:8080}
